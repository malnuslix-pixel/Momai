<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mwalimu Family — Control Room</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1a1a1a;--mu:#5b5f5b;--ln:#e2ded5;--g:#2c5f2d;--gl:#4a8c4b;--ac:#f4a261;--bad:#b3261e;--ok:#1f7a3a;--warn:#a65d00;--chip:#eaf0ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a0f;--card:#16251a;--tx:#f1f1ec;--mu:#b3bdb4;--ln:#2a3d2d;--g:#7fc080;--gl:#7fc080;--bad:#ff8a80;--ok:#7fd48f;--warn:#ffc266;--chip:#1d3122;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a0f;--card:#16251a;--tx:#f1f1ec;--mu:#b3bdb4;--ln:#2a3d2d;--g:#7fc080;--gl:#7fc080;--bad:#ff8a80;--ok:#7fd48f;--warn:#ffc266;--chip:#1d3122;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Segoe UI',system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:1rem 1.2rem .4rem}
h1{font:700 1.3rem Georgia,serif;margin:0;color:var(--g)}
h2{font:700 1.05rem Georgia,serif;margin:0 0 .6rem;color:var(--g)}
nav{display:flex;gap:.3rem;overflow-x:auto;padding:.4rem 1.2rem .8rem;border-bottom:1px solid var(--ln)}
nav a{white-space:nowrap;padding:.45rem .9rem;border-radius:50px;color:var(--tx);text-decoration:none;font-weight:600;border:1px solid transparent}
nav a.on{background:var(--g);color:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:1.2rem}
.grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:.9rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:1rem}
.kpi b{display:block;font:700 1.9rem Georgia,serif;line-height:1.1}
.mu{color:var(--mu);font-size:.85rem}
.up{color:var(--ok)}.dn{color:var(--bad)}
.p{display:inline-block;padding:.1rem .6rem;border-radius:50px;font-size:.78rem;font-weight:700;background:var(--chip);color:var(--g)}
.p.bad{background:var(--bad);color:#fff}.p.warn{background:var(--ac);color:#1a1a1a}.p.ok{background:var(--ok);color:#fff}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:.4rem .6rem;max-width:100%}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
label{display:block;font-weight:600;font-size:.85rem;margin:.5rem 0 .2rem}
.b{font:600 .9rem inherit;font-family:inherit;padding:.5rem 1rem;border-radius:50px;border:2px solid var(--g);background:var(--g);color:var(--bg);cursor:pointer}
.b.s{background:transparent;color:var(--g);padding:.25rem .7rem}
.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hb{display:grid;grid-template-columns:8.5rem 1fr 3.6rem;gap:.5rem;align-items:center;margin:.35rem 0}
.hb i{height:.65rem;border-radius:9px;background:linear-gradient(90deg,var(--gl) var(--w),var(--chip) var(--w))}
.hb b{text-align:right;font-size:.85rem}
.al{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem 0;border-bottom:1px solid var(--ln)}
.al:last-child{border:0}
.tg{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--ln)}
.note{background:var(--chip);border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin-bottom:.9rem}
.ck label{display:flex;gap:.5rem;align-items:center;font-weight:400;margin:.15rem 0}
svg{max-width:100%;height:auto}
</style>
</head>
<body>
<header>
<h1>Mwalimu Family · Control Room</h1>
<div><span class="p warn">Sample data</span> <button class="b s" data-a="theme">Light / dark</button> <button class="b s" data-a="reset">Reset sample</button></div>
</header>
<nav id="tabs" aria-label="Dashboard sections"></nav>
<main id="v"></main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var NOW=new Date(),TODAY=NOW.toISOString().slice(0,10);
var D=function(n){var d=new Date(NOW);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
var dd=function(iso){return Math.round((new Date(iso+'T00:00:00Z')-new Date(TODAY+'T00:00:00Z'))/864e5)};
var SEED=function(){return{
items:[
{id:1,k:'job',t:'Grade 7 Mathematics teacher',who:'Sample school',loc:'Nairobi',cat:'Teaching',body:'Example listing showing the layout.',st:'published',exp:D(70)},
{id:2,k:'job',t:'Evening KCSE maths tutor',who:'Sample tutoring centre',loc:'Mombasa',cat:'Tutoring',body:'Example listing.',st:'published',exp:D(2)},
{id:3,k:'notice',t:'Results release windows',who:'Ministry of Education',loc:'',cat:'Exams',body:'KJSEA results expected in December 2026. KCSE and KPSEA targeted for January 2027.',st:'published',exp:D(45)},
{id:4,k:'notice',t:'Results scam alert',who:'Mwalimu Family',loc:'',cat:'Safety',body:'Never pay to see results early. Use official channels only.',st:'published',exp:D(45)}],
subs:[
{ref:'JOB-261119-4821',type:'Job listing',k:'job',from:'Hillcrest Academy',title:'Science teacher, Grade 8',hrs:52,st:'new',c:[0,0,0]},
{ref:'NTC-261120-3317',type:'Notice',k:'notice',from:'Kisumu Girls Parents Assoc.',title:'Grade 10 reporting dates meeting',hrs:20,st:'new',c:[0,0,0]},
{ref:'ADV-261120-7702',type:'Advertising quote',k:'ad',from:'BrightPath Tutors',title:'Newsletter and WhatsApp mention',hrs:18,st:'new',c:[0,0,0]},
{ref:'TUT-261121-1190',type:'Tutor request',k:'find',from:'Parent, Nakuru',title:'Grade 9 Mathematics, online',hrs:3,st:'new',c:[0,0,0]},
{ref:'TTR-261118-5521',type:'Tutor application',k:'tut',from:'J. Wanjiru',title:'English and Kiswahili, Grades 4–8',hrs:75,st:'new',c:[0,0,0]},
{ref:'JOB-261117-6004',type:'Job listing',k:'job',from:'Quick Cash Recruiters',title:'Teacher, pay KES 2,000 application fee',hrs:98,st:'rejected',c:[1,0,1]}],
checks:[
{n:'KJSEA performance bands',last:'2026-11-21'},{n:'KCSE points and mean grades',last:'2026-11-21'},{n:'KUCCPS cluster formula',last:'2026-11-21'},{n:'Lead story figures',last:'2026-11-21'},
{n:'Grade 10 pathway text',last:null},{n:'Glossary definitions',last:null},{n:'Quiz answers',last:null},{n:'Fees planner arithmetic',last:null},{n:'Official links resolve',last:null}],
flags:{maint:false,scam:true,lite:false,ai:true,forms:true,sw:true},banner:'',log:[]}};
var S;try{S=JSON.parse(localStorage.getItem('mfd2')||'null')}catch(e){}
if(!S||!S.items)S=SEED();S.comp=S.comp||{};S.rt=S.rt||{};var INF='all';
function at(h){return new Date(NOW-h*36e5).toISOString().slice(0,16).replace('T',' ')}
function wk(){var d=new Date(TODAY+'T00:00:00Z'),y=d.getUTCFullYear();return y+'-W'+Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7)+':'}
function inSum(){var f=function(x){return S.subs.filter(function(s){return s.st===x})},n=f('new'),a=f('approved').length,r=f('rejected').length,old=n.reduce(function(m,s){return Math.max(m,s.hrs)},0),late=n.filter(function(s){return s.hrs>48}).length;
return'<div class="grid">'+[['Waiting',n.length,late?late+' past the 48 h target':'Within target'],['Approved',a,'This period'],['Rejected',r,'Failed a verification check'],['Approval rate',(a+r?Math.round(a/(a+r)*100):0)+'%','Oldest waiting: '+old+' h']].map(function(k){return'<div class="card kpi"><span class="mu">'+k[0]+'</span><b>'+k[1]+'</b><span class="mu">'+k[2]+'</span></div>'}).join('')+'</div><p><label for="fl" style="display:inline">Show </label><select id="fl" data-a="flt">'+['all','new','approved','rejected'].map(function(o){return'<option'+(o===INF?' selected':'')+'>'+o+'</option>'}).join('')+'</select></p>'}
var save=function(){try{localStorage.setItem('mfd2',JSON.stringify(S))}catch(e){}};
var log=function(m){S.log.unshift({t:NOW.toISOString().slice(0,16).replace('T',' '),m:m});S.log=S.log.slice(0,30);save()};
var VIS=[820,910,880,1040,990,760,700,1180,1260,1210,1490,1720,2150,2480],QS=[41,38,52,47,44,30,28,66,71,69,98,121,152,186];
var bars=function(rows,fmt){var m=Math.max.apply(null,rows.map(function(r){return r[1]}));return rows.map(function(r){return'<div class="hb"><span>'+esc(r[0])+'</span><i style="--w:'+Math.round(r[1]/m*100)+'%"></i><b>'+(fmt?fmt(r[1]):r[1])+'</b></div>'}).join('')};
var fmtn=function(n){return n.toLocaleString('en-US')};
var chart=function(a,lbl){var m=Math.max.apply(null,a),w=560,h=140,bw=w/a.length;return'<svg viewBox="0 0 '+w+' '+(h+22)+'" role="img" aria-label="'+esc(lbl)+'">'+a.map(function(v,i){var bh=Math.max(3,v/m*h);return'<rect x="'+(i*bw+4)+'" y="'+(h-bh)+'" width="'+(bw-8)+'" height="'+bh+'" rx="4" fill="'+(i===a.length-1?'var(--ac)':'var(--gl)')+'"/>'}).join('')+'<text x="4" y="'+(h+16)+'" font-size="11" fill="var(--mu)">14 days ago</text><text x="'+(w-4)+'" y="'+(h+16)+'" font-size="11" text-anchor="end" fill="var(--mu)">today</text></svg>'};
function alerts(){var a=[];
S.subs.filter(function(s){return s.st==='new'&&s.hrs>48}).forEach(function(s){a.push(['bad','Submission '+s.ref+' has waited '+s.hrs+' hours. Editorial target is 48.','inbox'])});
S.items.filter(function(i){return i.st==='published'}).forEach(function(i){var d=dd(i.exp);if(d<0)a.push(['bad','“'+i.t+'” expired '+(-d)+' day(s) ago and is hidden from readers.','content']);else if(d<=3)a.push(['warn','“'+i.t+'” expires in '+d+' day(s).','content'])});
var due=S.checks.filter(function(c){return!c.last||dd(c.last)<-30});if(due.length)a.push(['warn',due.length+' data item(s) are unverified or older than 30 days.','health']);
var kj=dd('2026-12-31');a.push(['ok','KJSEA results are targeted for December. '+(kj>0?kj+' days left in the window.':'The window has ended; check official channels.')+' Check KNEC and the Ministry twice daily.','health']);
if(S.flags.maint)a.push(['bad','Maintenance mode is ON. Visitors see the maintenance notice.','config']);
return a}
var V={};
V.overview=function(){var pend=S.subs.filter(function(s){return s.st==='new'}).length,al=alerts();
return'<div class="note">Everything here is sample data so you can try the workflow. See “Going live” in Config for the endpoints that replace it.</div>'+
'<div class="grid">'+[['Visitors today',fmtn(VIS[13]),'+15% vs yesterday','up'],['Installed app',342,'+27 this week','up'],['Email subscribers',fmtn(1284),'+96 this week','up'],['Submissions waiting',pend,pend?'Review in Inbox':'All clear',pend?'dn':'up'],['Assistant questions today',QS[13],'12% fell back to built-in help','mu'],['Error rate','0.4%','Target under 1%','up'],['Returning visitors','38%','+4 points vs last month','up'],['Average time on page','2m 41s','Exams hub: 4m 05s','mu'],['Tool completions','6,120','This week: calculators and quizzes','up'],['Email open rate','47%','Last roundup, 21 Nov','up']].map(function(k){return'<div class="card kpi"><span class="mu">'+k[0]+'</span><b>'+k[1]+'</b><span class="'+k[3]+' mu">'+k[2]+'</span></div>'}).join('')+'</div>'+
'<div class="grid g2"><div class="card"><h2>Visitors, last 14 days</h2>'+chart(VIS,'Daily visitors for the last 14 days')+'<p class="mu">Traffic is rising ahead of results season.</p></div>'+
'<div class="card"><h2>Needs attention</h2>'+al.map(function(x){return'<div class="al"><span class="p '+x[0]+'">'+({bad:'Act',warn:'Soon',ok:'Info'})[x[0]]+'</span><span>'+esc(x[1])+' <a href="#'+x[2]+'">Open</a></span></div>'}).join('')+'</div></div>'+season()+recent()};
function season(){var w=[['KJSEA results','December 2026 target','2026-12-31'],['KCSE and KPSEA results','January 2027 target','2027-01-31']];
return'<div class="card" style="margin-bottom:.9rem"><h2>Results season</h2>'+w.map(function(x){var d=dd(x[2]);return'<div class="tg"><span><b>'+x[0]+'</b><div class="mu">'+x[1]+'. Targets until KNEC or the Ministry confirms a date.</div></span><span class="p '+(d<0?'':'warn')+'">'+(d>=0?d+' days left':'window over')+'</span></div>'}).join('')+'<p class="mu" style="margin-top:.6rem">Playbook: check KNEC and the Ministry twice a day, keep the scam alert pinned, update the ticker the same day, and watch traffic and error rate.</p></div>'}
function recent(){return'<div class="card"><h2>Recent activity</h2>'+[['2 min ago','New email subscriber, from a WhatsApp share'],['14 min ago','KCSE grade calculator used 120 times in the last hour'],['1 h ago','Submission TUT-261121-1190 received'],['3 h ago','Assistant fell back to built-in help for a Grade 10 question']].concat(S.log.slice(0,4).map(function(l){return[l.t,'You: '+l.m]})).map(function(r){return'<div class="al"><span class="mu" style="min-width:6.5rem">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'}).join('')+'</div>'}
function feed(){var d=NOW.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),L=function(i){return i.st==='published'};
return JSON.stringify({updated:TODAY,jobs:S.items.filter(function(i){return i.k==='job'&&L(i)}).map(function(i){return{t:i.t,e:i.who,l:i.loc,c:i.cat,d:i.body,st:'published',exp:i.exp}}),notices:S.items.filter(function(i){return i.k==='notice'&&L(i)}).map(function(i){return{k:i.cat,d:d,t:i.t,b:i.body,st:'published'}})},null,2)}
var CATS=['Teaching','School management','Support staff','Tutoring','Exams','Safety','Schools','Events'];
V.content=function(){return'<div class="card"><h2>Jobs and notices</h2><div class="sc"><table><tr><th>Item</th><th>Type</th><th>Status</th><th>Expires</th><th></th></tr>'+S.items.map(function(i){var ex=i.st==='published'&&dd(i.exp)<0;return'<tr><td><b>'+esc(i.t)+'</b><div class="mu">'+esc(i.who)+' · '+esc(i.cat)+'</div></td><td>'+(i.k==='job'?'Job':'Notice')+'</td><td><select data-a="st" data-id="'+i.id+'" aria-label="Status">'+['draft','published','rejected'].map(function(o){return'<option'+(o===i.st?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'+(ex?' <span class="p bad">expired</span>':'')+'</td><td><input type="date" data-a="exp" data-id="'+i.id+'" value="'+esc(i.exp)+'" aria-label="Expiry date"></td><td><button class="b s" data-a="del" data-id="'+i.id+'">Delete</button></td></tr>'}).join('')+'</table></div></div>'+
'<div class="grid g2" style="margin-top:.9rem"><div class="card"><h2>Add an item</h2><label for="nk">Type</label><select id="nk"><option value="job">Job</option><option value="notice">Notice</option></select><label for="nt">Title</label><input id="nt" style="width:100%"><label for="nw">Employer or organisation</label><input id="nw" style="width:100%"><label for="nl">Location (jobs)</label><input id="nl" style="width:100%"><label for="nc">Category</label><select id="nc">'+CATS.map(function(c){return'<option>'+c+'</option>'}).join('')+'</select><label for="nb">Details</label><textarea id="nb" rows="3"></textarea><label for="ne">Expires</label><input id="ne" type="date" value="'+D(30)+'"><p><button class="b" data-a="add">Save as draft</button> <span id="nm" class="mu"></span></p></div>'+
'<div class="card"><h2>feed.json for the site</h2><p class="mu">Only published items appear. Paste this into <code>feed.json</code> and deploy. Expired items hide themselves on the site.</p><textarea id="fo" rows="16" readonly>'+esc(feed())+'</textarea><p><button class="b" data-a="copy" data-t="fo">Copy feed.json</button> <span id="cm" class="mu"></span></p></div></div>'};
V.inbox=function(){var CK=['Identity confirmed','No fee asked of applicants or learners','Details confirmed with an official source'];
return'<div class="note">Editorial rule: nothing is approved until all three checks are ticked. Approved jobs and notices are created as drafts in Content.</div>'+inSum()+S.subs.filter(function(s){return INF==='all'||s.st===INF}).map(function(s){var all=s.c.every(Boolean),open=s.st==='new';return'<div class="card" style="margin-bottom:.9rem"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><div><b>'+esc(s.title)+'</b><div class="mu">'+esc(s.type)+' · '+esc(s.from)+' · '+esc(s.ref)+' · submitted '+at(s.hrs)+'</div></div><div><span class="p '+(s.st==='new'?(s.hrs>48?'bad':'warn'):s.st==='approved'?'ok':'')+'">'+s.st+'</span> <span class="mu">'+(s.hrs>=24?Math.floor(s.hrs/24)+'d ':'')+(s.hrs%24)+'h old</span></div></div>'+(open?'<div class="ck">'+CK.map(function(c,i){return'<label><input type="checkbox" data-a="chk" data-ref="'+s.ref+'" data-i="'+i+'"'+(s.c[i]?' checked':'')+'> '+c+'</label>'}).join('')+'</div><p><button class="b" data-a="appr" data-ref="'+s.ref+'"'+(all?'':' disabled')+'>Approve</button> <button class="b s" data-a="rej" data-ref="'+s.ref+'">Reject</button></p>':'')+'</div>'}).join('')};
V.audience=function(){return'<div class="grid g2"><div class="card"><h2>Where visitors come from</h2>'+bars([['WhatsApp',41],['Google',28],['Direct',14],['YouTube',9],['TikTok',8]],function(v){return v+'%'})+'<p class="mu">Strong WhatsApp share: invest in the channel and share cards.</p></div><div class="card"><h2>Devices</h2>'+bars([['Mobile',88],['Desktop',10],['Tablet',2]],function(v){return v+'%'})+'<p class="mu">Mobile first. Keep pages light for slow data.</p></div></div>'+
'<div class="grid g2"><div class="card"><h2>Top pages this week</h2>'+bars([['Exams hub',9420],['KCSE grade calculator',5310],['Results scam alert',4880],['Parents’ hub',3150],['Library',2740],['KUCCPS cluster points',2290]],fmtn)+'</div><div class="card"><h2>Subscribers, last 6 weeks</h2>'+chart([760,850,940,1020,1188,1284],'Subscribers by week')+'<p class="mu">1,284 on email and WhatsApp. Add an unsubscribe link before bulk sends.</p></div></div>'+
'<div class="grid g2"><div class="card"><h2>Top counties</h2>'+bars([['Nairobi',24],['Kiambu',9],['Nakuru',7],['Mombasa',7],['Kisumu',6],['Machakos',4]],function(v){return v+'%'})+'</div><div class="card"><h2>New and returning</h2>'+bars([['New visitors',62],['Returning',38]],function(v){return v+'%'})+'<h2 style="margin-top:1rem">Subscribers by channel</h2>'+bars([['Email',812],['WhatsApp',472]],fmtn)+'</div></div>'+
'<div class="card"><h2>Tool usage this week</h2>'+bars([['KCSE grade calculator',3280],['KUCCPS cluster points',2150],['Quizzes',1370],['KJSEA points total',1490],['Lesson plan builder',980],['Score to performance level',860]],fmtn)+'<p class="mu">Tools with high use and low completion are the best candidates to improve.</p></div>'};
V.assistant=function(){var tot=QS.reduce(function(a,b){return a+b},0),mo=Math.round(tot/14*30);
return'<div class="grid"><div class="card kpi"><span class="mu">Questions, 14 days</span><b>'+fmtn(tot)+'</b></div><div class="card kpi"><span class="mu">Projected per month</span><b>'+fmtn(mo)+'</b></div><div class="card kpi"><span class="mu">Fell back to built-in help</span><b>12%</b></div><div class="card kpi"><span class="mu">Estimated monthly cost</span><b id="cost">$'+(mo*0.002).toFixed(2)+'</b><label for="cpq" class="mu">Cost per question ($)</label><input id="cpq" type="number" step="0.0005" min="0" value="0.002" data-a="cpq" style="width:7rem"></div></div>'+
'<div class="grid g2"><div class="card"><h2>Questions per day</h2>'+chart(QS,'Assistant questions per day')+'</div><div class="card"><h2>Unanswered or low confidence</h2>'+['“When is the KCSE retake?”','“How do I check my Grade 10 placement?”','“Is the NHIF needed for HELB?”','“Where do I get the KPSEA results slip?”'].map(function(q){return'<div class="al"><span style="flex:1">'+q+'</span><span class="p">Add to guide</span></div>'}).join('')+'<p class="mu">Turn repeat questions into Exams hub entries and update the assistant’s facts.</p></div></div>'+
'<div class="grid g2"><div class="card"><h2>What people ask about</h2>'+bars([['Exam results',34],['KUCCPS and cluster',18],['Grade 10 pathways',16],['HELB and fees',11],['Templates',9],['Other',12]],function(v){return v+'%'})+'</div><div class="card"><h2>Quality</h2>'+[['Rated helpful','81%'],['Rated not helpful','7%'],['No rating','12%'],['Median reply time','1.4 s'],['Flagged for review','3']].map(function(r){return'<div class="tg"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join('')+'<p class="mu">Review flagged answers weekly and fix the assistant’s facts when official dates change.</p></div></div>'};
V.health=function(){var svc=[['Website hosting','Operational','ok'],['API worker (forms, newsletter, chat)','Operational','ok'],['Email delivery','Operational','ok'],['Storage (KV)','Operational','ok'],['Claude API','Operational','ok'],['Service worker','v mf-v1 active','ok']];

'<div class="card"><h2>Data freshness (re-check monthly)</h2><div class="sc"><table><tr><th>Item</th><th>Last verified</th><th>Status</th><th></th></tr>'+S.checks.map(function(c,i){var a=c.last?-dd(c.last):null,st=a===null?['bad','Never checked']:a>30?['bad','Overdue']:['ok','Due in '+(30-a)+' d'];return'<tr><td>'+esc(c.n)+'</td><td>'+(c.last||'—')+'</td><td><span class="p '+st[0]+'">'+st[1]+'</span></td><td><button class="b s" data-a="ver" data-i="'+i+'">Mark verified today</button></td></tr>'}).join('')+'</table></div></div>'+selfTests()+compliance()};
function selfTests(){var kc=function(t){var T=[[81,'A'],[74,'A-'],[67,'B+'],[60,'B'],[53,'B-'],[46,'C+'],[39,'C'],[32,'C-'],[25,'D+'],[18,'D'],[11,'D-'],[1,'E']];for(var i=0;i<T.length;i++)if(t>=T[i][0])return T[i][1];return'E'},LV=[[90,'EE1'],[75,'EE2'],[58,'ME1'],[41,'ME2'],[31,'AE1'],[21,'AE2'],[11,'BE1'],[0,'BE2']],lv=function(p){return LV.filter(function(x){return p>=x[0]})[0][1]},cl=function(r,t){return(Math.sqrt(r/48*t/84)*48).toFixed(3)};
var T=[['KCSE mean grade, 84 points',kc(84),'A'],['KCSE, 80 points',kc(80),'A-'],['KCSE, 66 points',kc(66),'B'],['KCSE, 10 points',kc(10),'E'],['KJSEA 90%',lv(90),'EE1'],['KJSEA 89%',lv(89),'EE2'],['KJSEA 58%',lv(58),'ME1'],['KJSEA 57%',lv(57),'ME2'],['KJSEA 40%',lv(40),'AE1'],['KJSEA 11%',lv(11),'BE1'],['KJSEA 10%',lv(10),'BE2'],['KJSEA maximum, 9 areas × 8',9*8,72],['Cluster, r=40 and t=67',cl(40,67),'39.133'],['Cluster, r=48 and t=84',cl(48,84),'48.000']],p=T.filter(function(x){return String(x[1])===String(x[2])}).length;
return'<div class="card" style="margin-top:.9rem"><h2>Rule self-checks ('+p+' of '+T.length+' pass)</h2><p class="mu">Reference values from the verification log, computed here. The browser test suite covers the live page.</p><div class="sc"><table><tr><th>Check</th><th>Result</th><th>Expected</th><th></th></tr>'+T.map(function(x){var ok=String(x[1])===String(x[2]);return'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td><span class="p '+(ok?'ok':'bad')+'">'+(ok?'Pass':'Fail')+'</span></td></tr>'}).join('')+'</table></div></div>'}
function compliance(){var L=['Privacy notice reviewed by an adviser','ODPC registration confirmed','Unsubscribe link live','Submissions older than 180 days purged this month','Backups of feed and subscriber list tested','API keys rotated in the last 90 days','Dashboard behind a login'],n=L.filter(function(x,i){return S.comp[i]}).length;
return'<div class="card" style="margin-top:.9rem"><h2>Privacy and security checklist ('+n+' of '+L.length+')</h2><div class="ck">'+L.map(function(x,i){return'<label><input type="checkbox" data-a="comp" data-k="'+i+'"'+(S.comp[i]?' checked':'')+'> '+x+'</label>'}).join('')+'</div></div>'}
var FL=[['maint','Maintenance mode','Show a maintenance notice to visitors'],['scam','Scam alert banner','Show the “never pay for results” banner on all pages'],['lite','Lite mode by default','Light pages for slow connections'],['ai','Ask Mwalimu assistant','Turn the chat on or off'],['forms','Submission forms','Accept jobs, notices, adverts and tutor requests'],['sw','Offline support','Service worker caching']];
function cfg(){return JSON.stringify({maintenance:S.flags.maint,scam_banner:S.flags.scam,lite_default:S.flags.lite,assistant:S.flags.ai,forms:S.flags.forms,offline:S.flags.sw,site_banner:S.banner},null,2)}
V.config=function(){return'<div class="grid g2"><div class="card"><h2>Site controls</h2>'+FL.map(function(f){return'<div class="tg"><span><b>'+f[1]+'</b><div class="mu">'+f[2]+'</div></span><input type="checkbox" data-a="flag" data-k="'+f[0]+'"'+(S.flags[f[0]]?' checked':'')+' aria-label="'+f[1]+'"></div>'}).join('')+'<label for="bn">Site-wide banner text (blank hides it)</label><input id="bn" data-a="banner" style="width:100%" value="'+esc(S.banner)+'" placeholder="e.g. KJSEA results expected in December. Never pay for results."></div>'+
'<div class="card"><h2>config.json</h2><p class="mu">The site reads this at startup (to be added). Copy and deploy.</p><textarea id="co" rows="12" readonly>'+esc(cfg())+'</textarea><p><button class="b" data-a="copy" data-t="co">Copy config.json</button> <span id="cm" class="mu"></span></p></div></div>'+
'<div class="grid g2"><div class="card"><h2>Audit log</h2>'+(S.log.length?S.log.map(function(l){return'<div class="al"><span class="mu">'+l.t+'</span><span>'+esc(l.m)+'</span></div>'}).join(''):'<p class="mu">No changes yet.</p>')+'</div><div class="card"><h2>Going live</h2><ol class="mu" style="padding-left:1.1rem"><li>Protect this page with Cloudflare Access or a login so only your team can open it.</li><li>Add admin endpoints to the worker: list and update submissions, read stats, read and write feed and config.</li><li>Send analytics events (privacy-friendly) and uptime pings to the stats endpoint.</li><li>Replace the sample arrays with fetch calls and keep the audit log on the server.</li><li>Roles: editor (content, inbox), admin (controls), viewer (read only).</li></ol></div></div>'};
var TABS=[['overview','Overview'],['content','Content'],['inbox','Inbox'],['audience','Audience'],['assistant','Assistant'],['health','Health'],['ops','Operations'],['config','Config']];
V.ops=function(){var W=[['Monday',1,[['m1','Check Tier 1 sources and update countdowns'],['m2','Expire old jobs and notices in feed.json']]],['Tuesday',2,[['t1','Publish 2 news briefs and 1 explainer']]],['Wednesday',3,[['w1','Publish one library item']]],['Thursday',4,[['h1','Clear the submissions inbox']]],['Friday',5,[['f1','Send the WhatsApp and email roundup'],['f2','Publish corrections'],['f3','Spot-check one calculator']]]],tot=0,done=0;
W.forEach(function(d){d[2].forEach(function(t){tot++;if(S.rt[wk()+t[0]])done++})});
return'<div class="card"><h2>This week’s routine ('+done+' of '+tot+' done)</h2><div class="ck">'+W.map(function(d){return'<div style="margin:.6rem 0"><b>'+d[0]+'</b>'+(NOW.getUTCDay()===d[1]?' <span class="p warn">Today</span>':'')+d[2].map(function(t){return'<label><input type="checkbox" data-a="rt" data-k="'+t[0]+'"'+(S.rt[wk()+t[0]]?' checked':'')+'> '+t[1]+'</label>'}).join('')+'</div>'}).join('')+'</div><p class="mu">Matches the editorial guide. Ticks reset each week.</p></div>'+
'<div class="grid g2" style="margin-top:.9rem"><div class="card"><h2>Roles and access</h2><div class="sc"><table><tr><th>Area</th><th>Viewer</th><th>Editor</th><th>Admin</th></tr>'+[['Overview and reports','✓','✓','✓'],['Content and Inbox','','✓','✓'],['Site controls and config','','','✓'],['Audit log','','','✓']].map(function(r){return'<tr>'+r.map(function(c,i){return'<td>'+(i?'<b>'+c+'</b>':c)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div><p class="mu">Not enforced yet. Needs a login and server-side checks.</p></div>'+
'<div class="card"><h2>Alert rules</h2>'+[['Submission waits over 48 h','Editor, WhatsApp'],['Item expires in 3 days','Editor, email'],['Error rate above 1%','Admin, WhatsApp'],['Data check overdue','Editor, email'],['Assistant daily cap reached','Admin, email']].map(function(r){return'<div class="tg"><span>'+r[0]+'</span><span class="p">'+r[1]+'</span></div>'}).join('')+'<p class="mu">Planned. Sending them needs the backend.</p></div></div>'};
function render(){var h=(location.hash||'#overview').slice(1);if(!V[h])h='overview';var p=S.subs.filter(function(s){return s.st==='new'}).length;
$('#tabs').innerHTML=TABS.map(function(t){return'<a href="#'+t[0]+'"'+(t[0]===h?' class="on" aria-current="page"':'')+'>'+t[1]+(t[0]==='inbox'&&p?' ('+p+')':'')+'</a>'}).join('');

var byId=function(id){return S.items.filter(function(i){return i.id===+id})[0]},byRef=function(r){return S.subs.filter(function(s){return s.ref===r})[0]};
document.addEventListener('click',function(e){var b=e.target.closest('button[data-a]');if(!b)return;var a=b.dataset.a,r;
if(a==='theme'){var de=document.documentElement,dk=de.dataset.theme?de.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;de.dataset.theme=dk?'light':'dark'}
else if(a==='reset'){S=SEED();save();render()}
else if(a==='del'){r=byId(b.dataset.id);S.items=S.items.filter(function(i){return i!==r});log('Deleted “'+r.t+'”');render()}
else if(a==='add'){var t=$('#nt').value.trim(),w=$('#nw').value.trim(),bd=$('#nb').value.trim();if(!t||!w||!bd){$('#nm').textContent='Please fill title, organisation and details.';return}
S.items.push({id:Date.now(),k:$('#nk').value,t:t,who:w,loc:$('#nl').value.trim(),cat:$('#nc').value,body:bd,st:'draft',exp:$('#ne').value||D(30)});log('Added draft “'+t+'”');render()}
else if(a==='appr'||a==='rej'){r=byRef(b.dataset.ref);if(a==='appr'){r.st='approved';if(r.k==='job'||r.k==='notice')S.items.push({id:Date.now(),k:r.k,t:r.title,who:r.from,loc:'',cat:r.k==='job'?'Teaching':'Schools',body:'Details to be completed from submission '+r.ref+'.',st:'draft',exp:D(30)});log('Approved '+r.ref)}else{r.st='rejected';log('Rejected '+r.ref)}render()}
else if(a==='ver'){var c=S.checks[+b.dataset.i];c.last=TODAY;log('Verified “'+c.n+'”');render()}
else if(a==='copy'){var ta=$('#'+b.dataset.t);ta.select();var ok=function(){$('#cm').textContent='Copied.'};try{navigator.clipboard.writeText(ta.value).then(ok,function(){document.execCommand('copy');ok()})}catch(x){try{document.execCommand('copy');ok()}catch(y){$('#cm').textContent='Select the text and copy it.'}}}});
document.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.a,r;if(!a)return;
if(a==='st'){r=byId(t.dataset.id);r.st=t.value;log('Set “'+r.t+'” to '+t.value);render()}
else if(a==='exp'){r=byId(t.dataset.id);r.exp=t.value;log('Changed expiry of “'+r.t+'” to '+t.value);render()}
else if(a==='chk'){byRef(t.dataset.ref).c[+t.dataset.i]=t.checked?1:0;save();render()}
else if(a==='flag'){S.flags[t.dataset.k]=t.checked;log((t.checked?'Turned on ':'Turned off ')+t.dataset.k);render()}
else if(a==='banner'){S.banner=t.value;log('Updated site banner');save()}
else if(a==='flt'){INF=t.value;render()}
else if(a==='comp'){S.comp[t.dataset.k]=t.checked;save();render()}
else if(a==='rt'){S.rt[wk()+t.dataset.k]=t.checked;save();render()}});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.a==='cpq'){var mo=Math.round(QS.reduce(function(a,b){return a+b},0)/14*30);$('#cost').textContent='$'+(mo*(+t.value||0)).toFixed(2)}else if(t.dataset&&t.dataset.a==='banner'){S.banner=t.value;$('#co').value=cfg()}});
window.addEventListener('hashchange',render);render();
})();
