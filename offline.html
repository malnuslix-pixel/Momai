<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5f2d">
<title>Offline — Mwalimu Family</title>
<style>
:root{--bg:#faf8f5;--tx:#1a1a1a;--mu:#555;--g:#2c5f2d;--ac:#f4a261;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a0f;--tx:#f1f1ec;--mu:#b8c2b9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--bg);color:var(--tx);font:18px/1.6 'Segoe UI',system-ui,sans-serif;padding-top:max(2rem,env(safe-area-inset-top));padding-bottom:max(2rem,env(safe-area-inset-bottom))}
main{max-width:30rem;text-align:center}
h1{font-family:Georgia,serif;font-size:2rem;margin:.5rem 0}
p{color:var(--mu)}
a,button{display:inline-block;margin:.4rem;padding:.8rem 1.6rem;border-radius:50px;border:2px solid var(--g);background:var(--g);color:#fff;font:600 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer}
a.o{background:transparent;color:var(--g)}
@media(prefers-color-scheme:dark){a.o{color:#7fc080;border-color:#7fc080}}
</style>
</head>
<body>
<main>
<div style="font-size:3rem" aria-hidden="true">📴</div>
<h1>You are offline</h1>
<p>This page is not saved on your phone yet. Pages you have already opened, including tools and revision notes, still work without data.</p>
<button onclick="location.reload()">Try again</button>
<a class="o" href="./">Go to home page</a>
</main>
</body>
</html>
